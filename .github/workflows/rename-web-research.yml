name: Rename Web Research

on:
  push:
    branches:
      - feature/local-tool-registry
    paths:
      - scripts/rename_web_research.py
      - .github/workflows/rename-web-research.yml

permissions:
  contents: write

jobs:
  rename:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/local-tool-registry
      - name: Apply rename
        run: python scripts/rename_web_research.py
      - name: Check application JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>', html)
          Path('/tmp/privatellmlens.js').write_text('\n'.join(scripts), encoding='utf-8')
          assert '>Web Research</label>' in html
          assert 'Deep Web Research' not in html
          assert 'Deep Web Research' not in Path('README.md').read_text(encoding='utf-8')
          assert 'Deep Web Research' not in Path('corefunctionality.md').read_text(encoding='utf-8')
          PY
          node --check /tmp/privatellmlens.js
      - name: Commit rename
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html README.md corefunctionality.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Rename Deep Web Research to Web Research"
          git push origin HEAD:feature/local-tool-registry
